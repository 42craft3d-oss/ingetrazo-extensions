# After a merge into main: rebuild catalog.json, which ingetrazo.com reads.
# The page picks it up within minutes; nobody has to deploy anything.
name: publish

on:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "screenshots/**"
      - "reviewed.toml"
      - "tools/catalog.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/catalog.py check --offline
      - run: python tools/catalog.py build
      - name: Commit catalog.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          # The timestamp alone is not a change worth a commit.
          if git diff --cached -I '"generated"' --quiet; then
            echo "catalog.json unchanged"
          else
            git commit -m "catalog.json: rebuild"
            git push
          fi
